<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1f5f9">
  <meta name="description" content="Suivez l’avancement de votre réparation avec E-Links.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <title>Suivi de réparation · E-Links</title>
</head>
<body class="min-h-screen bg-slate-100 px-4 py-8 text-slate-900">
  <main class="mx-auto max-w-md">
    <header class="rounded-2xl bg-gradient-to-br from-slate-950 via-blue-950 to-violet-950 p-5 text-white shadow-lg">
      <p class="text-xs font-bold uppercase tracking-[.2em] text-blue-200">E-Links · Atelier Express</p>
      <h1 class="mt-2 text-2xl font-black">Suivi de réparation</h1>
    </header>
    <section class="mt-4 rounded-2xl bg-white p-5 shadow-sm">
      <p id="tracking-message" role="status" aria-live="polite" class="text-sm text-slate-600">Chargement du dossier…</p>
      <div id="tracking-details" class="hidden">
        <h2 id="tracking-device" class="mt-2 text-xl font-black"></h2>
        <p class="mt-4 text-sm text-slate-500">Statut de la réparation</p>
        <p id="tracking-status" class="mt-1 text-lg font-bold text-teal-800"></p>
        <p id="tracking-updated" class="mt-2 text-xs text-slate-500"></p>
        <div class="mt-5 border-t border-slate-100 pt-4">
          <h3 class="font-bold">Recevoir une alerte</h3>
          <p class="mt-1 text-sm text-slate-500">Autorisez les notifications pour être averti quand l’appareil est prêt.</p>
          <button id="enable-notifications" type="button"
            class="mt-3 w-full rounded-xl bg-teal-700 px-4 py-3 font-bold text-white">
            M’avertir quand c’est prêt
          </button>
          <button id="disable-notifications" type="button"
            class="mt-2 hidden w-full rounded-xl bg-slate-100 px-4 py-3 text-sm font-semibold text-slate-700">
            Désactiver l’alerte pour ce dossier
          </button>
        </div>
      </div>
    </section>
    <p class="mt-4 text-center text-xs text-slate-500">Aucune information personnelle ou financière n’est affichée ici.</p>
  </main>
  <script src="/suivi.js" defer></script>
</body>
</html>
